<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="index.html"><img src="assets/logo.svg" alt="DFC logo"><span>Worship Team Hub</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <ul class="nav-links" id="primary-nav">
        <li><a href="index.html" data-nav="index">Home</a></li>
        <li><a href="activities.html" data-nav="activities">Activities</a></li>

        <li><a href="dashboard.html" data-nav="dashboard">Dashboard</a></li>
        <li><a href="assignment.html" data-nav="assignment">Assignment</a></li>
        <li><a href="sunday-service.html" data-nav="sunday-service">Sunday Service</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="page-title"><p class="eyebrow">Team rotation</p><h1>Assignment</h1></section>
    <section class="section">
      <div class="page-shell">
        <div class="assignment-tabs" role="tablist" aria-label="Assignment sections">
          <button class="assignment-tab is-active" type="button" id="mainTeamTab" role="tab" aria-selected="true" aria-controls="mainTeamPanel" data-assignment-tab="main-team">Main Team</button>
          <button class="assignment-tab" type="button" id="teensYouthTab" role="tab" aria-selected="false" aria-controls="teensYouthPanel" data-assignment-tab="teens-youth">Teens & Youth</button>
          <button class="assignment-tab" type="button" id="prayerFastingTab" role="tab" aria-selected="false" aria-controls="prayerFastingPanel" data-assignment-tab="prayer-fasting">Prayer & Fasting</button>
        </div>
        <section class="assignment-panel is-active" id="mainTeamPanel" role="tabpanel" aria-labelledby="mainTeamTab" data-assignment-panel="main-team">
          <div class="record-grid assignment-record-grid" data-assignment-sheet="Assignments" data-assignment-kind="main"></div>
        </section>
        <section class="assignment-panel" id="teensYouthPanel" role="tabpanel" aria-labelledby="teensYouthTab" data-assignment-panel="teens-youth" hidden>
          <div class="record-grid assignment-record-grid" data-assignment-sheet="YouthFellowship" data-assignment-kind="youth"></div>
        </section>
        <section class="assignment-panel" id="prayerFastingPanel" role="tabpanel" aria-labelledby="prayerFastingTab" data-assignment-panel="prayer-fasting" hidden>
          <div class="record-grid assignment-record-grid" data-assignment-sheet="PrayerFasting" data-assignment-kind="prayer"></div>
        </section>
      </div>
    </section>
  </main>
